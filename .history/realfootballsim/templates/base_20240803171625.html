<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Football Manager{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'competitions:championship_list' %}">Championships</a></li>
                {% if user.is_authenticated %}
                    {% if user.club %}
                        <li><a href="{% url 'clubs:club_detail' user.club.id %}">My Club</a></li>
                    {% else %}
                        <li><a href="{% url 'clubs:create_club' %}">Create Club</a></li>
                    {% endif %}
                    <li><a href="{% url 'accounts:logout' %}">Logout</a></li>
                {% else %}
                    <li><a href="{% url 'accounts:login' %}">Login</a></li>
                    <li><a href="{% url 'accounts:register' %}">Register</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <main role="main">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 Football Manager. All rights reserved.</p>
    </footer>
</body>
</html>
